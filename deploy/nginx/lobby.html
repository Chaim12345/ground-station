<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111213">
  <title>Ground Station is starting</title>
  <link rel="icon" type="image/png" href="/__lobby-logo.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Roboto, Arial, sans-serif;
      font-synthesis: none;
      background: #111213;
      color: #e6edf5;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, #1c3032 0, #111719 35%, #111213 75%);
    }
    main {
      width: min(100%, 460px);
      padding: 40px 36px 34px;
      text-align: center;
      border: 1px solid #383c42;
      border-radius: 12px;
      background: #1a1c1e;
      box-shadow: 0 24px 70px #0006;
    }
    .logo { width: 112px; height: 112px; display: block; margin: 0 auto 24px; }
    .eyebrow {
      margin: 0 0 11px;
      color: #7bd3b0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(26px, 5vw, 32px); line-height: 1.2; font-weight: 600; }
    .description { margin: 17px 0 27px; color: #aeb8c1; font-size: 15px; line-height: 1.6; }
    .progress {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: #30383d;
    }
    .progress::after {
      content: "";
      display: block;
      width: 35%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4f9dff, #7bd3b0);
      animation: sweep 2s ease-in-out infinite alternate;
    }
    .status { margin: 20px 0 0; color: #cbd7dd; font-size: 14px; }
    .status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 9px 1px 0;
      border-radius: 50%;
      background: #ffcc66;
      box-shadow: 0 0 10px #ffcc6677;
    }
    .note { margin: 18px 0 0; color: #89949d; font-size: 12px; line-height: 1.5; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
    @media (max-width: 480px) { main { padding: 32px 24px 28px; } }
    @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/__lobby-logo.png" alt="Ground Station logo" width="112" height="112">
    <p class="eyebrow">Ground Station</p>
    <h1>Preparing your station</h1>
    <p class="description">The server is starting. The first launch may take a little longer.</p>
    <div class="progress" aria-hidden="true"></div>
    <p id="status" class="status" role="status" aria-live="polite">Waiting for the server…</p>
    <p class="note">This page will open the station automatically when it is ready.</p>
  </main>
  <script>
    (() => {
      const status = document.getElementById('status');
      let attempts = 0;

      async function checkReady() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 3000);
        try {
          const response = await fetch('/api/ready', {
            cache: 'no-store',
            headers: { Accept: 'application/json' },
            signal: controller.signal,
          });
          if (response.ok && (await response.json()).ready === true) {
            status.textContent = 'Station ready. Opening…';
            window.location.reload();
            return;
          }
        } catch (_) {
          // Connection failures are expected while the backend initializes.
        } finally {
          clearTimeout(timeout);
        }

        attempts += 1;
        if (attempts === 30) {
          status.textContent = 'Still waiting. Check the container logs if this continues.';
        }
        setTimeout(checkReady, 2000);
      }

      checkReady();
    })();
  </script>
</body>
</html>
